const STORAGE='vietnamese-hide-seek-classroom-v1';
let data={image:DEFAULT_IMAGE,items:structuredClone(DEFAULT_ITEMS)};
try{const saved=JSON.parse(localStorage.getItem(STORAGE));if(saved?.items?.length&&saved.image)data=saved;}catch(e){}
let selected=null,done=new Set(),errors=0,editing=false,audioOn=true,speechOn=true,showHints=false;
const $=id=>document.getElementById(id);
function save(){try{localStorage.setItem(STORAGE,JSON.stringify(data));}catch(e){toast('圖片較大，瀏覽器空間不足；請使用匯出題庫保存。')}}
function toast(msg){$('toast').textContent=msg;$('toast').style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').style.display='none',2600)}
function sound(ok){if(!audioOn)return;try{let a=new (window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.connect(g);g.connect(a.destination);o.type='sine';o.frequency.value=ok?660:220;g.gain.setValueAtTime(.09,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.2);o.start();o.stop(a.currentTime+.2)}catch(e){}}
function speak(t){if(!speechOn)return;if(!('speechSynthesis'in window)){toast('此瀏覽器不支援語音朗讀');return;}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='vi-VN';u.rate=.82;const vs=speechSynthesis.getVoices();const v=vs.find(x=>x.lang.toLowerCase()==='vi-vn')||vs.find(x=>x.lang.toLowerCase().startsWith('vi'));if(v)u.voice=v;else toast('此裝置可能未安裝越南語語音，請確認發音是否正確');speechSynthesis.speak(u)}
function render(){ $('picture').src=data.image;$('total').textContent=data.items.length;$('counter').textContent=done.size;$('errors').textContent=errors;$('bar').style.width=(100*done.size/(data.items.length||1))+'%';$('scene').classList.toggle('editing',editing);$('editor').classList.toggle('visible',editing);$('sideTitle').textContent=editing?'點選單字並設定圖片熱區':'請選擇要尋找的單字';$('words').innerHTML='';document.querySelectorAll('.hot').forEach(x=>x.remove());data.items.forEach(item=>{let b=document.createElement('button');b.className='word'+(selected===item.id?' active':'')+(done.has(item.id)?' done':'');b.innerHTML=`<span><span class="vi"></span><br><span class="zh"></span></span><span class="sound">🔊</span>`;b.querySelector('.vi').textContent=(done.has(item.id)?'✓ ':'')+item.vi;b.querySelector('.zh').textContent=item.zh;b.onclick=e=>{if(e.target.closest('.sound')){speak(item.vi);return;}if(done.has(item.id)&&!editing)return;selected=item.id;if(editing)loadFields(item);else speak(item.vi);render()};$('words').appendChild(b);let h=document.createElement('button');h.className='hot'+(done.has(item.id)?' done':'')+(editing&&selected===item.id?' selected':'');h.style.cssText=`left:${item.x}%;top:${item.y}%;width:${item.w}%;height:${item.h}%;`;h.title=editing?item.vi:'';h.setAttribute('aria-label',editing?item.vi:'圖片中的物品');h.onclick=e=>{e.stopPropagation();if(editing){selected=item.id;loadFields(item);render();return;}check(item.id)};$('scene').appendChild(h)});}
function check(id){if(editing)return;if(selected===null){toast('請先選擇單字');return;}if(done.has(selected))return;if(id===selected){done.add(id);sound(true);let it=data.items.find(i=>i.id===id);$('status').textContent='🎉 答對了！ '+it.vi+' · '+it.zh;speak(it.vi);selected=null;render();if(done.size===data.items.length){$('status').textContent='🏆 全部完成！太棒了！';setTimeout(()=>sound(true),300)}}else{errors++;sound(false);$('errors').textContent=errors;$('status').textContent='再試一次！找找看其他位置。';toast('再試一次 💪')}}
$('scene').addEventListener('click',e=>{if(!editing)return;let r=$('scene').getBoundingClientRect();if(selected===null){toast('請先選擇要設定的單字');return;}let it=data.items.find(i=>i.id===selected);if(!it)return;it.x=Math.round((e.clientX-r.left)/r.width*1000)/10;it.y=Math.round((e.clientY-r.top)/r.height*1000)/10;save();render();toast('熱區位置已設定')});
function loadFields(i){$('viInput').value=i.vi;$('zhInput').value=i.zh;$('widthInput').value=i.w;$('heightInput').value=i.h}
$('saveWord').onclick=()=>{let i=data.items.find(x=>x.id===selected);if(!i){toast('請先選擇單字');return;}i.vi=$('viInput').value.trim();i.zh=$('zhInput').value.trim();i.w=Math.max(2,Math.min(100,+$('widthInput').value||10));i.h=Math.max(2,Math.min(100,+$('heightInput').value||10));if(!i.vi){toast('越南語不可空白');return;}save();render();toast('已儲存')};
$('newWord').onclick=()=>{let id=Math.max(0,...data.items.map(i=>i.id))+1;data.items.push({id,vi:'單字',zh:'中文',x:50,y:50,w:12,h:12});selected=id;loadFields(data.items.at(-1));save();render();toast('請修改單字並點擊圖片設定位置')};
$('deleteWord').onclick=()=>{if(selected===null)return;if(!confirm('確定刪除這個單字？'))return;data.items=data.items.filter(i=>i.id!==selected);selected=null;save();render()};
$('upload').onchange=e=>{let f=e.target.files[0];if(!f)return;if(!f.type.startsWith('image/'))return toast('請選擇圖片');let reader=new FileReader();reader.onload=()=>{let im=new Image();im.onload=()=>{let max=1600,ratio=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*ratio);c.height=Math.round(im.height*ratio);c.getContext('2d').drawImage(im,0,0,c.width,c.height);data.image=c.toDataURL('image/jpeg',.85);save();render();toast('圖片已更換，請重新確認所有熱區位置')};im.src=reader.result};reader.readAsDataURL(f)};
$('editToggle').onclick=()=>{editing=!editing;selected=null;$('editToggle').textContent=editing?'🎮 返回遊戲':'✏️ 老師編輯';$('status').textContent=editing?'編輯模式：選擇單字，再點圖片設定物品位置':'請選擇單字，然後在圖片中找出物品';render()};
$('restart').onclick=()=>{done.clear();selected=null;errors=0;$('status').textContent='新的挑戰開始！請選擇單字。';render()};
$('reveal').onclick=()=>{showHints=!showHints;document.querySelectorAll('.hot').forEach(h=>{if(showHints){h.style.borderColor='#fb5b6c';h.style.background='#fb5b6c44'}else{h.style.borderColor='';h.style.background=''}});$('reveal').textContent=showHints?'🙈 隱藏答案位置':'👁 顯示答案位置'};
$('audioToggle').onclick=()=>{audioOn=!audioOn;$('audioToggle').textContent=audioOn?'🔊 音效開':'🔇 音效關'};
$('speechToggle').onclick=()=>{speechOn=!speechOn;$('speechToggle').textContent=speechOn?'🗣️ 語音開':'🤐 語音關'};
$('help').onclick=()=>alert('玩法：① 點選右側越南語單字 ② 在教室圖片中點擊對應物品 ③ 答對打勾並朗讀，全部找到即過關！\n\n老師編輯：選單字→點圖片設定位置→調整熱區寬高→儲存。');
$('export').onclick=()=>{let blob=new Blob([JSON.stringify({version:1,...data},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='越南語找圖_學校與教室_題庫.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('importBtn').onclick=()=>$('importFile').click();$('importFile').onchange=async e=>{try{let d=JSON.parse(await e.target.files[0].text());if(!Array.isArray(d.items)||typeof d.image!=='string'||!d.image.startsWith('data:image/'))throw Error('格式不符');if(!d.items.every(i=>typeof i.vi==='string'&&typeof i.x==='number'))throw Error('單字格式不符');data={image:d.image,items:d.items};done.clear();selected=null;save();render();toast('題庫匯入成功')}catch(err){toast('匯入失敗：'+err.message)}};
render();</script></body></html>
