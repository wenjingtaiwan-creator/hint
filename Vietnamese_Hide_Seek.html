terId)}};scene.onpointermove=e=>{if(!dragStart)return;let r=scene.getBoundingClientRect(),p={x:Math.max(0,Math.min(100,(e.clientX-r.left)/r.width*100)),y:Math.max(0,Math.min(100,(e.clientY-r.top)/r.height*100))},w=theme().words.find(w=>w.id===(dragStart.id||editingWord));if(!w)return;if(dragStart.mode==='draw'){w.x=Math.round(Math.min(p.x,dragStart.p.x));w.y=Math.round(Math.min(p.y,dragStart.p.y));w.w=Math.max(1,Math.round(Math.abs(p.x-dragStart.p.x)));w.h=Math.max(1,Math.round(Math.abs(p.y-dragStart.p.y)))}else{w.x=Math.max(0,Math.min(100-w.w,Math.round(dragStart.orig.x+p.x-dragStart.p.x)));w.y=Math.max(0,Math.min(100-w.h,Math.round(dragStart.orig.y+p.y-dragStart.p.y)))}let el=scene.querySelector('[data-edit-hot="'+w.id+'"]');if(el){el.style.left=w.x+'%';el.style.top=w.y+'%';el.style.width=w.w+'%';el.style.height=w.h+'%'}};scene.onpointerup=()=>{if(dragStart){dragStart=null;drawMode=false;save();renderEdit()}}}function exportJSON(){let b=new Blob([JSON.stringify({version:1,themes:data},null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='越找越會說_題庫.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}function importJSON(file){if(!file)return;let r=new FileReader();r.onload=()=>{try{let j=JSON.parse(r.result),arr=j.themes;if(!Array.isArray(arr)||!arr.every(t=>typeof t.name==='string'&&typeof t.image==='string'&&Array.isArray(t.words)&&t.words.every(w=>typeof w.vi==='string'&&typeof w.x==='number')))throw Error();if(!confirm('匯入會取代目前全部題庫，是否繼續？'))return;data=arr;active=data[0]?.id||null;save();if(active)renderEdit();else home();toast('匯入完成')}catch(e){toast('題庫格式錯誤')}};r.readAsText(file)}$('#homeBtn').onclick=home;$('#editBtn').onclick=edit;home();</script></body></html>
